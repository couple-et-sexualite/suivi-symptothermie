name: Validate SymRella

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/sensiplan-fertility-classification]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests and HTML/JS checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test
      - name: Check HTML and JavaScript
        run: npm run check
