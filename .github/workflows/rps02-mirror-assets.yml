name: RPS-02 local asset mirror
on:
  workflow_dispatch:
  push:
    branches: ["fix/rps02-asset-quality"]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rps02-asset-quality
          fetch-depth: 0
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Mirror assets
        run: node scripts/mirror-rps02-assets.mjs
      - name: Validate blind manifest
        run: node scripts/validate-rps02-blind-manifest.js
      - name: Validate image dimensions and file types
        run: |
          set -euo pipefail
          for f in data/rps02-blind-assets/RPS02-A0{1..9}.jpg; do
            identify -format '%f %m %wx%h\n' "$f"
            test "$(identify -format '%m' "$f")" = "JPEG"
            width="$(identify -format '%w' "$f")"
            height="$(identify -format '%h' "$f")"
            test "$width" -ge 200
            test "$height" -ge 200
          done
      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rps02-blind-assets data/rps02-local-asset-manifest.json
          git diff --cached --quiet || git commit -m "RPS-02: replace page captures with source photos"
          git push origin HEAD:fix/rps02-asset-quality
